<!DOCTYPE html>
<html>
<head>
	
	<title>Game</title>
	
	<style>
			
		body {
			background-image: url("MangoBackground.png");
			background-repeat: no-repeat;
			background-attachment: fixed;
			background-size: cover;
			overflow: hidden;
			margin: 0;
		}
		
		#basket {
			width: 200px;
			position: absolute;
			bottom: 1px;
		}
		
		#mango {
			width: 80px;
			position: absolute;
			top: 0px;
			left: 300px;
		}
		
		#score {
			position: absolute;
			top: 30px;
			left: 50%;
			transform: translateX(-50%);
			font-size: 30px;
			font-family: Trebuchet MS;
		}
		
		#highScore {
			position: absolute;
			top: 70px;
			left: 50%;
			transform: translateX(-50%);
			font-size: 30px;
			font-family: Trebuchet MS;
		}
		
		#lives {
			position: absolute;
			top: 110px;
			left: 50%;
			transform: translateX(-50%);
			font-size: 30px;
			font-family: Trebuchet MS;
		}
		
		#gameOver {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			text-align: center;
			font-family: Trebuchet MS;
			font-size: 30px;
			display: none;
		}
		
	</style>
	
</head>
<body>
	
	<p id="score">Score: 0</p>
	<p id="highScore">High Score: 0</p>
	<p id="lives"></p>
	
	<div id="gameOver">
		<h1 style="color:red;">GAME OVER</h1>
		<p id="finalScore" style="color:#0000ff;"></p>
		<p>Press <span style="color:MediumSeaGreen;">SPACE</span> to Restart</p>
	</div>
	
	<img src="MangoBasket.png" id="basket">
	<img src="mango.png" id="mango">
	
	<script>
		// ====================
		// HTML elements
		// ====================
		let basket = document.getElementById("basket");
		let mango = document.getElementById("mango");
		let scoreText = document.getElementById("score");
		let highScoreText = document.getElementById("highScore");
		let livesText = document.getElementById("lives");
		let gameOverScreen = document.getElementById("gameOver");
		let finalScore = document.getElementById("finalScore");
		
		// ====================
		// Player movement
		// ====================
		let moveRight = false;
		let moveLeft = false;
		
		let basketPosition = (window.innerWidth - basket.offsetWidth) / 2;
		let maxPosition = window.innerWidth - basket.offsetWidth;
		let speed = 10;
		
		// ====================
		// Mango movement
		// ====================
		let mangoX = Math.random() * (window.innerWidth - mango.offsetWidth);
		let mangoY = 0;
		let fallSpeed = 5;
		
		// ====================
		// Score system
		// ====================
		let score = 0;
		let highScore = 0;
		
		// ====================
		// Lives system
		// ====================
		let lives = 3;
		let gameRunning = true;
		
		// ====================
		// Basket collision area
		// ====================
		let catchLeft;
		let catchRight;
		let basketPadding = 70;
		let catchHeight = 120;
		
		basket.style.left = basketPosition + "px";
		
		document.addEventListener("keydown", function(event) {
			if (event.key === "ArrowRight") {
				moveRight = true;
			}
			
			if (event.key === "ArrowLeft") {
				moveLeft = true;
			}
			
			if (event.key === " " && !gameRunning) {
				restartGame();
			}
		});
			
		document.addEventListener("keyup", function(event) {
			if (event.key === "ArrowRight") {
					moveRight = false;
			}
				
			if (event.key === "ArrowLeft") {
					moveLeft = false;
			}
		});
		
		// ====================
		// Game Functions
		// ====================
		function restartGame() {
			score = 0;
			lives = 3;
			
			moveLeft = false;
			moveRight = false;
			
			speed = 10;
			fallSpeed = 5;
			
			scoreText.textContent = "Score: " + score;
			highScoreText.textContent = "High Score: " + highScore;
			updateLives();
			
			basketPosition = (window.innerWidth - basket.offsetWidth) / 2;
			basket.style.left = basketPosition + "px";
			
			resetMango();
			
			gameOverScreen.style.display = "none";
			mango.style.display = "block";
			
			gameRunning = true;
			
			requestAnimationFrame(gameLoop);
		}
		
		function gameOver() {
			finalScore.textContent = "Final Score: " + score;
			gameOverScreen.style.display = "block";
			mango.style.display = "none";
			gameRunning = false;
		}
		
		// ====================
		// Mango Movement
		// ====================
		function resetMango() {
			mangoY = 0;
			mangoX = Math.random() * (window.innerWidth - mango.offsetWidth);
			
			mango.style.left = mangoX + "px";
			mango.style.top = mangoY + "px";
		}
		
		// ====================
		// Lives Display
		// ====================
		function updateLives() {
			if (lives === 3) {
				livesText.textContent = "❤️ ❤️ ❤️";
			}
			
			if (lives === 2) {
				livesText.textContent = "❤️ ❤️";
			}
			
			if (lives === 1) {
				livesText.textContent = "❤️";
			}
			
			if (lives === 0) {
				livesText.textContent = "";
			}
		}
		
		// ====================
		// Main Game Loop
		// ====================
		function gameLoop() {
			if (!gameRunning) {
				return;
			}
			
			if (moveRight) {
				basketPosition += speed;
			}
			
			if (moveLeft) {
				basketPosition -= speed;
			}
				
			if (basketPosition < 0) {
				basketPosition = 0;
			}
			
			if (basketPosition > maxPosition) {
				basketPosition = maxPosition;
			}
			
			basket.style.left = basketPosition + "px";
			
			catchLeft = basketPosition + basketPadding;
			catchRight = basketPosition + basket.offsetWidth - basketPadding;
			
			mangoY += fallSpeed;
			
			mango.style.left = mangoX + "px";
			mango.style.top = mangoY + "px";
			
			if (mangoY > window.innerHeight) 
			{
				resetMango();
				
				lives--;
				updateLives();
				
				if (lives <= 0) {
					gameOver();
				}
			}
			
			if (mangoY + mango.offsetHeight >= window.innerHeight - basket.offsetHeight + catchHeight) {
				
				if (mangoX + mango.offsetWidth >= catchLeft && mangoX <= catchRight) 
				{
					resetMango();
					
					score++;
					scoreText.textContent = "Score: " + score;
					
					if (score > highScore) {
						highScore = score;
						highScoreText.textContent = "High Score: " + highScore;
					}
				}
			}
			
			requestAnimationFrame(gameLoop);
		}
		
		// ====================
		// Start Game
		// ====================
		updateLives();
		requestAnimationFrame(gameLoop);
	</script>
	
</body>
</html>
