<!DOCTYPE html>
<html>
<head>
	
	<title>Game</title>
	
	<style>
			
		body {
			background-image: url("MangoBackground.png");
			background-repeat: no-repeat;
			background-attachment: fixed;
			background-size: cover;
			overflow: hidden;
			margin: 0;
		}
		
		#basket {
			width: 200px;
			position: absolute;
			bottom: 1px;
		}
		
		#mango {
			width: 80px;
			position: absolute;
			top: 0px;
			left: 300px;
		}
		
		#score {
			position: absolute;
			top: 30px;
			left: 50%;
			transform: translateX(-50%);
			font-size: 30px;
			font-family: Trebuchet MS;
		}
		
		#highScore {
			position: absolute;
			top: 70px;
			left: 50%;
			transform: translateX(-50%);
			font-size: 30px;
			font-family: Trebuchet MS;
		}
		
		#lives {
			position: absolute;
			top: 110px;
			left: 50%;
			transform: translateX(-50%);
			font-size: 30px;
			font-family: Trebuchet MS;
		}
		
		#gameOver {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			text-align: center;
			font-family: Trebuchet MS;
			font-size: 30px;
			display: none;
		}
		
	</style>
	
</head>
<body>
	
	<p id="score">Score: 0</p>
	<p id="highScore">High Score: 0</p>
	<p id="lives">Lives: 3</p>
	
	<div id="gameOver">
		<h1 style="color:red;">GAME OVER</h1>
		<p id="finalScore" style="color:MediumSeaGreen;"></p>
		<p>Press SPACE to Restart</p>
	</div>
	
	<img src="MangoBasket.png" id="basket">
	<img src="mango.png" id="mango">
	
	<script>
		let basket = document.getElementById("basket");
		let mango = document.getElementById("mango");
		let scoreText = document.getElementById("score");
		let highScoreText = document.getElementById("highScore");
		let livesText = document.getElementById("lives");
		let gameOverScreen = document.getElementById("gameOver");
		let finalScore = document.getElementById("finalScore");
		
		let moveRight = false;
		let moveLeft = false;
		
		let maxPosition = window.innerWidth - basket.offsetWidth;
		let position = (window.innerWidth - basket.offsetWidth) / 2;
		
		let speed = 10;
		let fallSpeed = 5;
		
		let score = 0;
		let highScore = 0;
		
		let lives = 3;
		
		let mangoX = Math.random() * (window.innerWidth - mango.offsetWidth);
		let mangoY = 0;
		
		basket.style.left = position + "px";
		
		document.addEventListener("keydown", function(event) {
			if (event.key === "ArrowRight") {
				moveRight = true;
			}
			
			if (event.key === "ArrowLeft") {
				moveLeft = true;
			}
			});
			
		document.addEventListener("keyup", function(event) {
			if (event.key === "ArrowRight") {
					moveRight = false;
			}
				
			if (event.key === "ArrowLeft") {
					moveLeft = false;
			}
			});
		
		function gameLoop() {
			if (moveRight) {
				position += speed;
			}
			
			if (moveLeft) {
				position -= speed;
			}
				
			if (position < 0) {
				position = 0;
			}
			
			if (position > maxPosition) {
				position = maxPosition;
			}
			
			basket.style.left = position + "px";
			
			mangoY += fallSpeed;
			
			mango.style.left = mangoX + "px";
			mango.style.top = mangoY + "px";
			
			if (mangoY > window.innerHeight) 
			{
				mangoY = 0;
				mangoX = Math.random() * (window.innerWidth - mango.offsetWidth);
				
				lives--;
				livesText.textContent = "Lives: " + lives;
				
				if (lives <= 0) {
					finalScore.textContent = "Final Score: " + score;
					gameOverScreen.style.display = "block";
					return;
				}
			}
			
			if (mangoY + mango.offsetHeight >= window.innerHeight - basket.offsetHeight + 120) {
				
				if (mangoX + mango.offsetWidth >= position && mangoX <= position + basket.offsetWidth) 
				{
					mangoY = 0;
					mangoX = Math.random() * (window.innerWidth - mango.offsetWidth)
					
					score++;
					scoreText.textContent = "Score: " + score;
					
					if (score > highScore) {
						highScore = score;
						highScoreText.textContent = "High Score: " + highScore;
					}
					
					console.log("Score:", score);
				}
			}
			
			requestAnimationFrame(gameLoop);
		}
		
		requestAnimationFrame(gameLoop);
	</script>
	
</body>
</html>
