<!DOCTYPE html>
<html>
<head>
	
	<title>Game</title>
	
	<style>
			
		body {
			background-image: url("MangoBackground.png");
			background-repeat: no-repeat;
			background-attachment: fixed;
			background-size: cover;
			overflow: hidden;
			margin: 0;
		}
		
		#basket {
			width: 200px;
			position: absolute;
			bottom: 1px;
		}
		
		#mango {
			width: 80px;
			position: absolute;
			top: 0px;
			left: 300px;
		}
		
		#coconut {
			width: 80px;
			position: absolute;
			top: 0px;
			left: 300px;
			display: none;
		}
		
		#level {
			position: absolute;
			top: 30px;
			left: 50%;
			transform: translateX(-50%);
			font-size: 30px;
			font-family: Trebuchet MS;
		}
		
		#score {
			position: absolute;
			top: 70px;
			left: 50%;
			transform: translateX(-50%);
			font-size: 30px;
			font-family: Trebuchet MS;
		}
		
		#lives {
			position: absolute;
			top: 110px;
			left: 50%;
			transform: translateX(-50%);
			font-size: 30px;
			font-family: Trebuchet MS;
		}
		
		#gameOver {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			text-align: center;
			font-family: Trebuchet MS;
			font-size: 30px;
			display: none;
		}
		
		#levelComplete {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			text-align: center;
			font-family: Trebuchet MS;
			font-size: 30px;
			display: none;
		}
		
		#gameWon {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			text-align: center;
			font-family: Trebuchet MS;
			font-size: 30px;
			display: none;
		}
		
	</style>
	
</head>
<body>	
	<p id="level">Level: 1</p>
	<p id="score">Score: 0</p>
	<p id="lives"></p>
				<img src="coconut.png" id="coconut">
	
	<div id="gameOver">
		<h1 style="color:red;">GAME OVER</h1>
		<p id="finalScore" style="color:#0000ff;"></p>
		<p>Press <span style="color:green;">Enter</span> to Restart</p>
	</div>
	<div id="levelComplete">
		<h1 style="color:MediumSeaGreen;">Level Complete!</h1>
		<p>Press <span style="color:green;">Space</span> to continue</p>
	</div>
	<div id="gameWon">
		<h1 style="color:gold;">You Win!</h1>
		<p>Congratulations! You have completed all the levels!</p>
		<p>Press <span style="color:green;">Enter</span> to Restart</p>
	</div>
	
	<img src="MangoBasket.png" id="basket">
	<img src="mango.png" id="mango">
	<img src="coconut.png" id="coconut">
	
	<script>
		// ====================
		// HTML elements
		// ====================
		let basket = document.getElementById("basket");
		let mango = document.getElementById("mango");
		let coconut = document.getElementById("coconut");
		let scoreText = document.getElementById("score");
		let livesText = document.getElementById("lives");
		let levelText = document.getElementById("level");
		let gameOverScreen = document.getElementById("gameOver");
		let finalScore = document.getElementById("finalScore");
		let levelCompleteScreen = document.getElementById("levelComplete");
		let gameWonScreen = document.getElementById("gameWon");
		
		// ====================
		// Player movement
		// ====================
		let moveRight = false;
		let moveLeft = false;
		
		let basketPosition = (window.innerWidth - basket.offsetWidth) / 2;
		let maxPosition = window.innerWidth - basket.offsetWidth;
		let speed = 10;
		
		// ====================
		// Mango movement
		// ====================
		let mangoX = Math.random() * (window.innerWidth - mango.offsetWidth);
		let mangoY = 0;
		let fallSpeed = 5;
		
		// ====================
		// Coconut movement
		// ====================
		let coconutX = Math.random() * (window.innerWidth - coconut.offsetWidth);
		let coconutY = -300;
		
		// ====================
		// Score system
		// ====================
		let score = 0;
		let level = 1;
		let maxLevel = 10;
		let levelGoal = 20;
		
		// ====================
		// Lives system
		// ====================
		let lives = 3;
		let gameRunning = true;
		let levelFinished = false;
		
		// ====================
		// Basket collision area
		// ====================
		let catchLeft;
		let catchRight;
		let basketPadding = 70;
		let catchHeight = 120;
		
		basket.style.left = basketPosition + "px";
		
		// ====================
		// Keyboard
		// ====================
		document.addEventListener("keydown", function(event) {
			if (event.key === "ArrowRight") {
				moveRight = true;
			}
			
			if (event.key === "ArrowLeft") {
				moveLeft = true;
			}
			
			if (event.key === "Enter" && !gameRunning && !levelFinished) {
				restartGame();
			}
			
			if (event.key === " " && levelFinished) {
				nextLevel();
			}
		});
			
		document.addEventListener("keyup", function(event) {
			if (event.key === "ArrowRight") {
					moveRight = false;
			}
				
			if (event.key === "ArrowLeft") {
					moveLeft = false;
			}
		});
		
		// ====================
		// Game Functions
		// ====================
		function restartGame() {
			levelFinished = false;
			
			score = 0;
			lives = 3;
			
			setupLevel();
			updateLevel();
			
			moveLeft = false;
			moveRight = false;
			
			updateScore();
			updateLives();
			
			basketPosition = (window.innerWidth - basket.offsetWidth) / 2;
			basket.style.left = basketPosition + "px";
			
			resetMango();
			resetCoconut();
			
			gameOverScreen.style.display = "none";
			levelCompleteScreen.style.display = "none";
			gameWonScreen.style.display = "none";
			mango.style.display = "block";
			
			gameRunning = true;
			
			requestAnimationFrame(gameLoop);
		}
		
		function gameOver() {
			levelFinished = false;
			
			finalScore.textContent = "Final Score: " + score;
			gameOverScreen.style.display = "block";
			mango.style.display = "none";
			coconut.style.display = "none";
			
			gameRunning = false;
		}
		
		function gameWon() {
			gameRunning = false;
			levelFinished = false;
			
			gameWonScreen.style.display = "block";
			mango.style.display = "none";
			coconut.style.display = "none";
		}
		
		// ====================
		// Levels
		// ====================
		function setupLevel() {
			coconut.style.display = "none";
			
			if (level === 1) {
				fallSpeed = 5;
				speed = 10;
				levelGoal = 15;
			}
			
			else if (level === 2) {
				fallSpeed = 7;
				speed = 12;
				levelGoal = 18;
			}
			
			else if (level === 3) {
				fallSpeed = 8;
				speed = 13;
				levelGoal = 25;
				coconut.style.display = "block";
			}
			
			else if (level === 4) {
				fallSpeed = 9;
				speed = 16;
				levelGoal = 35;
			}
			
			else if (level === 5) {
				fallSpeed = 9;
				speed = 18;
				levelGoal = 40;
			}
			
			else if (level === 6) {
				fallSpeed = 9;
				speed = 20;
				levelGoal = 45;
			}
			
			else if (level === 7) {
				fallSpeed = 9;
				speed = 22;
				levelGoal = 50;
			}
			
			else if (level === 8) {
				fallSpeed = 9;
				speed = 24;
				levelGoal = 55;
			}
			
			else if (level === 9) {
				fallSpeed = 9;
				speed = 26;
				levelGoal = 60;
			}
			
			else if (level === 10) {
				fallSpeed = 9;
				speed = 28;
				levelGoal = 65;
			}
		}
		
		function levelComplete() {
			levelFinished = true;
			
			levelCompleteScreen.style.display = "block";
			mango.style.display = "none";
			coconut.style.display = "none";
			gameRunning = false;
		}
		
		function nextLevel() {
			if (level >= maxLevel) {
				gameWon();
				return;
			}
			
			levelFinished = false;
			
			level++;
			
			lives = 3;
			updateLives();
			
			score = 0;
			
			setupLevel();
			updateLevel();
			updateScore();
			
			levelCompleteScreen.style.display = "none";
			
			mango.style.display = "block";
			resetMango();
			resetCoconut();
			
			gameRunning = true;
			requestAnimationFrame(gameLoop);
		}
		
		function updateLevel() {
			levelText.textContent = "Level: " + level;
		}
		
		// ====================
		// Score
		// ====================
		function updateScore() {
			scoreText.textContent = "Score: " + score;
		}
		
		// ====================
		// Mango Movement
		// ====================
		function resetMango() {
			mangoY = 0;
			mangoX = Math.random() * (window.innerWidth - mango.offsetWidth);
			
			mango.style.left = mangoX + "px";
			mango.style.top = mangoY + "px";
		}
		
		// ====================
		// Coconut Movement
		// ====================
		function resetCoconut() {
			coconutY = -300;
			coconutX = Math.random() * (window.innerWidth - coconut.offsetWidth);
			
			coconut.style.left = coconutX + "px";
			coconut.style.top = coconutY + "px";
		}
		
		// ====================
		// Lives Display
		// ====================
		function updateLives() {
			if (lives === 3) {
				livesText.textContent = "❤️ ❤️ ❤️";
			}
			
			if (lives === 2) {
				livesText.textContent = "❤️ ❤️";
			}
			
			if (lives === 1) {
				livesText.textContent = "❤️";
			}
			
			if (lives === 0) {
				livesText.textContent = "";
			}
		}
		
		// ====================
		// Main Game Loop
		// ====================
		function gameLoop() {
			if (!gameRunning) {
				return;
			}
			
			if (moveRight) {
				basketPosition += speed;
			}
			
			if (moveLeft) {
				basketPosition -= speed;
			}
				
			if (basketPosition < 0) {
				basketPosition = 0;
			}
			
			if (basketPosition > maxPosition) {
				basketPosition = maxPosition;
			}
			
			basket.style.left = basketPosition + "px";
			
			catchLeft = basketPosition + basketPadding;
			catchRight = basketPosition + basket.offsetWidth - basketPadding;
			
			mangoY += fallSpeed;
			
			mango.style.left = mangoX + "px";
			mango.style.top = mangoY + "px";
			
			if (level === 3) {
				coconutY += fallSpeed;
				
				coconut.style.left = coconutX + "px";
				coconut.style.top = coconutY + "px";
			}
			
			if (mangoY > window.innerHeight) 
			{
				resetMango();
				
				lives--;
				updateLives();
				
				if (lives <= 0) {
					gameOver();
				}
			}
			
			if (mangoY + mango.offsetHeight >= window.innerHeight - basket.offsetHeight + catchHeight) {
				
				if (mangoX + mango.offsetWidth >= catchLeft && mangoX <= catchRight) 
				{
					resetMango();
					
					score++;
					
					// ====================
					// Level completion
					// ====================
					updateScore();
					
					if (score >= levelGoal) {
						levelComplete();
						return;
					}
				}
			}
			
			if (level === 3) {
				if (coconutY + coconut.offsetHeight >= window.innerHeight - basket.offsetHeight + catchHeight) {
					if (coconutX + coconut.offsetWidth >= catchLeft && coconutX <= catchRight) {
						lives--;
						updateLives();
						resetCoconut();
						
						if (lives <= 0) {
							gameOver();
							return;
						}
					}
				}
				
				if (coconutY > window.innerHeight) {
					resetCoconut();
				}
			}
			
			requestAnimationFrame(gameLoop);
		}
		
		// ====================
		// Start Game
		// ====================
		updateScore();
		setupLevel();
		updateLevel();
		updateLives();
		requestAnimationFrame(gameLoop);
	</script>
	
</body>
</html>
